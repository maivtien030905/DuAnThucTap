<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trợ lý AI Nông nghiệp</title>

  <!-- Thư viện Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Nạp file CSS của bạn -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="map"></div>

  <div id="chat-container">
    <div id="chat-header">Trợ lý Bản đồ Nông nghiệp AI</div>
    <div id="chat-box">
      <div class="message bot-msg">Xin chào! Bạn có thể hỏi tôi về vị trí thửa đất, độ ẩm, hoặc khoảng cách đến giếng tưới/nhà kho.</div>
    </div>
    <div id="chat-input-area">
      <input type="text" id="user-input" placeholder="Nhập câu hỏi... (VD: thửa nào trồng lúa?)">
      <button id="send-btn" onclick="xuLyCauHoi()">Gửi</button>
    </div>
  </div>

  <!-- Nạp file dữ liệu và logic JS -->
  <script src="data.js"></script>
  <script src="script.js"></script>

</body>
</html>
