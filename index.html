<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trợ lý AI Nông nghiệp</title>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #map {
      width: 70%;
      height: 100%;
    }

    #chat-container {
      width: 30%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background-color: #f8f9fa;
      border-left: 2px solid #ddd;
    }

    #chat-header {
      background-color: #2e7d32;
      color: white;
      padding: 15px;
      font-weight: bold;
      text-align: center;
    }

    #chat-box {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
    }

    .user-msg {
      align-self: flex-end;
      background-color: #e3f2fd;
      color: #0d47a1;
    }

    .bot-msg {
      align-self: flex-start;
      background-color: #ffffff;
      color: #333;
      border: 1px solid #e0e0e0;
    }

    #chat-input-area {
      display: flex;
      padding: 10px;
      background-color: white;
      border-top: 1px solid #ddd;
    }

    #user-input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
    }

    #send-btn {
      margin-left: 8px;
      padding: 10px 16px;
      background-color: #2e7d32;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    #send-btn:hover {
      background-color: #1b5e20;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="chat-container">
    <div id="chat-header">Trợ lý Bản đồ Nông nghiệp AI</div>
    <div id="chat-box">
      <div class="message bot-msg">Xin chào! Bạn có thể hỏi tôi về vị trí thửa đất, độ ẩm, hoặc khoảng cách đến giếng tưới/nhà kho.</div>
    </div>
    <div id="chat-input-area">
      <input type="text" id="user-input" placeholder="Nhập câu hỏi... (VD: thửa nào trồng lúa?)">
      <button id="send-btn" onclick="xuLyCauHoi()">Gửi</button>
    </div>
  </div>

  <!-- Nạp file dữ liệu bản đồ dạng JS -->
  <script src="data.js"></script>

  <script>
    // 1. Khởi tạo bản đồ Leaflet tại vị trí thửa đất thực tế
    const map = L.map('map').setView([19.9734, 105.9358], 18);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '© OpenStreetMap © CARTO'
}).addTo(map);

    let geojsonLayer;
    const SERVER_API = "http://127.0.0.1:8000";

    // Style mặc định cho các thửa đất
    function styleMacDinh(feature) {
      if (feature.geometry.type === "Point") return {};
      return {
        fillColor: '#4caf50',
        weight: 2,
        opacity: 1,
        color: '#2e7d32',
        fillOpacity: 0.4
      };
    }

    // Hiển thị dữ liệu GeoJSON lên bản đồ
    geojsonLayer = L.geoJSON(du_lieu_nong_trai, {
      style: styleMacDinh,
      onEachFeature: function (feature, layer) {
        if (feature.properties) {
          let popupContent = `<b>${feature.properties.ten || "Điểm mốc"}</b><br>`;
          if (feature.properties.cay_trong) popupContent += `Cây trồng: ${feature.properties.cay_trong}<br>`;
          if (feature.properties.dien_tich) popupContent += `Diện tích: ${feature.properties.dien_tich} m²<br>`;
          if (feature.properties.do_am) popupContent += `Độ ẩm: ${feature.properties.do_am}%<br>`;
          layer.bindPopup(popupContent);
        }
      }
    }).addTo(map);

    // 2. Hàm thêm tin nhắn vào khung Chat
    function themTinNhan(text, sender) {
      const chatBox = document.getElementById('chat-box');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${sender}-msg`;
      msgDiv.innerText = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // 3. Xử lý câu hỏi người dùng và gọi Backend API
    async function xuLyCauHoi() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if (!text) return;

      themTinNhan(text, 'user');
      input.value = '';

      const textLower = text.toLowerCase();

      try {
        let responseData = [];
        let botReply = "";

        // Trường hợp 1: Lọc theo cây trồng (Lúa / Rau / Cây ăn quả)
        if (textLower.includes("lúa") || textLower.includes("rau") || textLower.includes("cây ăn quả")) {
          let cay = textLower.includes("lúa") ? "Lúa" : (textLower.includes("rau") ? "Rau" : "Cây ăn quả");
          const res = await fetch(`${SERVER_API}/api/loc_thua?cay_trong=${encodeURIComponent(cay)}`);
          const json = await res.json();
          responseData = json.data;
          botReply = `Tìm thấy ${responseData.length} thửa trồng ${cay}: ${responseData.map(t => t.ten).join(', ')}`;
        }
        // Trường hợp 2: Tìm thửa độ ẩm thấp nhất / khô nhất
        else if (textLower.includes("khô") || textLower.includes("thấp nhất")) {
          const res = await fetch(`${SERVER_API}/api/thua_cuc_tri?thuoc_tinh=do_am&loai=min`);
          const json = await res.json();
          responseData = json.data;
          botReply = `Thửa có độ ẩm thấp nhất là ${responseData[0].ten} (${responseData[0].do_am}%).`;
        }
        // Trường hợp 3: Tìm thửa gần giếng
        else if (textLower.includes("giếng") || textLower.includes("gần giếng")) {
          const res = await fetch(`${SERVER_API}/api/thua_gan_moc?loai_moc=gieng&ban_kinh_met=150`);
          const json = await res.json();
          responseData = json.data;
          botReply = `Các thửa nằm trong bán kính 150m gần giếng tưới: ${responseData.map(t => t.ten).join(', ')}`;
        }
        else {
          botReply = "Xin lỗi, tôi chưa hiểu rõ ý bạn. Bạn hãy thử hỏi: 'Thửa nào trồng lúa?', 'Thửa nào khô nhất?' hoặc 'Thửa nào gần giếng?'";
        }

        themTinNhan(botReply, 'bot');

        // Highlight (đổi màu) các thửa được tìm thấy trên bản đồ
        highlightThuaDat(responseData.map(item => item.id));

      } catch (err) {
        themTinNhan("Lỗi kết nối tới server Backend! Bạn đã chạy 'uvicorn main:app --reload' chưa?", 'bot');
      }
    }

    // Highlight thửa đất khớp kết quả tìm kiếm
    function highlightThuaDat(danhSachId) {
      geojsonLayer.eachLayer(layer => {
        if (layer.feature.geometry.type !== "Point") {
          if (danhSachId.includes(layer.feature.properties.id)) {
            layer.setStyle({
              fillColor: '#ff5722',
              color: '#d84315',
              weight: 3,
              fillOpacity: 0.8
            });
            layer.openPopup();
          } else {
            geojsonLayer.resetStyle(layer);
          }
        }
      });
    }

    // Bấm Enter để gửi tin nhắn
    document.getElementById('user-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') xuLyCauHoi();
    });
  </script>
</body>
</html>
